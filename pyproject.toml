[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-n-adapt"
version = "2.0.0"
description = "Adaptive Windows cleanup and maintenance desktop app."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "snehil-pandey" }]
dependencies = ["rich>=15.0.0", "PySide6>=6.8.0"]

[project.optional-dependencies]
build = ["nuitka>=2.6", "ordered-set>=4.1.0", "zstandard>=0.23.0"]

[project.scripts]
cna = "clean_n_adapt.cli:main"
clean-n-adapt = "clean_n_adapt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
